<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>404 &mdash; Not Found</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(800px 500px at 50% -10%, rgba(0,150,57,.18), transparent 60%) #0b0f0d;
    color: #e8f0ea;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center; padding: 32px;
  }
  .code { font: 700 72px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #35c46a; letter-spacing: -.03em; }
  h1 { font-size: 20px; margin: 18px 0 8px; font-weight: 600; }
  p { color: #93a89a; margin: 0; }
  a { color: #35c46a; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>That page is not here</h1>

  </div>

</html>
